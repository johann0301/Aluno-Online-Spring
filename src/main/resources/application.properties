# Nome da aplicação
spring.application.name=Aluno Online

# Conexão com o Banco de Dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aluno-online}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: cria/atualiza tabelas automaticamente!
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Rodar scripts SQL (views + procedures) toda subida, APOS Hibernate criar tabelas.
# Separator ;; permite usar ; livremente dentro do corpo das procedures plpgsql.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/01_views.sql,classpath:db/02_procedures.sql
spring.sql.init.separator=;;
spring.jpa.defer-datasource-initialization=true

# Troque para true quando quiser apagar o banco demo e recriar os dados iniciais.
app.seed.reset=false

server.port=8081

# Documentacao OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Chave didática da aula; configure JWT_SECRET para usar uma chave própria.
api.security.token.secret=${JWT_SECRET:12345678}
